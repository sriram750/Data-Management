version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datamatrix_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datamatrix}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisToSecurePassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # PostgreSQL is accessed internally by backend via app_network:5432
    # Uncomment only if direct external database GUI access (e.g., DBeaver) is needed
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-datamatrix}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datamatrix_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=DataMatrix Enterprise Platform
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeThisToSecurePassword123!}@postgres:5432/${POSTGRES_DB:-datamatrix}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeThisToSecurePassword123!}@postgres:5432/${POSTGRES_DB:-datamatrix}
      - SECRET_KEY=${SECRET_KEY:-e93f77341b590e8c783c4f74d5386b0a88df54817a54a01c432d847fe734ad31}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-${ENCRYPTION_MASTER_KEY:-e93f77341b590e8c783c4f74d5386b0a88df54817a54a01c432d847fe734ad31}}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-${ENCRYPTION_KEY:-e93f77341b590e8c783c4f74d5386b0a88df54817a54a01c432d847fe734ad31}}
      - SESSION_TIMEOUT_MINUTES=60
      - MAX_FAILED_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION_MINUTES=15
      - UPLOAD_STORAGE_PATH=/app/storage/attachments
      - UPLOAD_DIR=/app/storage/attachments
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - backend_attachments:/app/storage/attachments
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datamatrix_frontend
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: datamatrix_proxy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  backend_attachments:
    driver: local

networks:
  app_network:
    driver: bridge
